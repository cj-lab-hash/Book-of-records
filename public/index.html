<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Book of Records</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    .controls { margin: 12px 0; }
    .btn { padding: 6px 10px; margin-right: 6px; cursor: pointer; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    #rawContainer, #filteredContainer { max-height: 70vh; overflow: auto; border: 1px solid #eee; padding: 8px; background: #fff; margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; font-size: 13px; }
    th { background: #f4f4f4; text-align: left; position: sticky; top: 0; z-index: 1; }
    .loading { color: #666; }
    .highlight-header { background: #e9f5ff; }
    .summary { margin-top: 8px; font-size: 13px; color: #333; }
    pre.debug { background:#f7f7f7; padding:8px; border:1px solid #eee; overflow:auto; }
    .date-hover {
  position: relative;
  cursor: pointer;
}

.date-hover .tooltip {
  display: none;
  position: absolute;
  left: 0;
  top: 20px;
  background: #333;
  color: #fff;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 4px;
  z-index: 10;
  white-space: nowrap;
}

.date-hover:hover .tooltip {
  display: block;
}
#dateSummaryPanel {
  position: fixed;
  right: 10px;
  top: 100px;
  width: 220px;
  max-height: 70vh;
  overflow-y: auto;
  border: 1px solid #ccc;
  background: #fff;
  padding: 10px;
  font-size: 13px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

#dateSummaryPanel h3 {
  margin-top: 0;
  font-size: 14px;
}

.date-summary-item {
  border-bottom: 1px solid #eee;
  padding: 6px 0;
}

.date-summary-item strong {
  display: block;
}

.date-summary-item .wht {
  color: red;
}
  </style>
</head>
<body>
  <h2>Book of Records for JM Pretty</h2>

  <form id="uploadForm">
    <input type="file" name="excelFile" accept=".xlsx,.xls" required />
    <button type="submit" class="btn">Upload</button>
  </form>

  <div class="controls">
    <button id="showRawBtn" class="btn" disabled>Show Full Sheet</button>
    <button id="showFilteredBtn" class="btn" disabled>Book of Records</button>
    <button id="showParticularsBtn" class="btn" disabled>Receipt</button>
  </div>

  <div id="rawContainer" style="display:none;">
    <h3>Full Sheet (every row and column)</h3>
    <div id="rawTableWrapper"></div>
    <div id="debug" class="debug"></div>
  </div>

  <div id="filteredContainer" style="display:none;">
    <h3>Filtered View</h3>
    <div id="filteredTableWrapper"></div>
    <div id="filteredSummary" class="summary"></div>
  </div>
  
  <div id="particularsContainer" style="display:none;">
    <h3>Particulars View (Grouped by date)</h3>
    <div id="particularsTableWrapper"></div>
  </div>

  <div id="dateSummaryPanel">
    <h3>Date Summary</h3>
    <div id="dateSummaryContent"></div>
  </div>
<script src="script.js"></script>
</body>
</html>
